name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CSVTK_REVISION: cc94b40d35cef9188d19f961718d9630479827c0
  CSVTK_TAG: v0.37.0
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - target: macos-x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
          - target: macos-aarch64
            runner: macos-15
            host: aarch64-apple-darwin
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      EXPECTED_HOST: ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare runner storage
        run: |
          set -euo pipefail
          for pair in CARGO_HOME=cargo-home CARGO_TARGET_DIR=cargo-target RUSTUP_HOME=rustup-home TMPDIR=scratch XDG_CACHE_HOME=cache GOPATH=go GOCACHE=cache/go-build GOMODCACHE=cache/go-mod; do
            name="${pair%%=*}"
            path="$RUNNER_TEMP/${pair#*=}"
            mkdir -p "$path"
            printf '%s=%s\n' "$name" "$path" >> "$GITHUB_ENV"
          done
          mkdir -p "$RUNNER_TEMP/delivery"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name in ('cargo-home', 'cargo-target', 'rustup-home', 'scratch', 'cache', 'go', 'cache/go-build', 'cache/go-mod'):
              path = (root / name).resolve(strict=True)
              assert path.is_relative_to(root) and path.stat().st_dev == root.stat().st_dev
              print(path)
          PY
          git rev-parse HEAD
          uname -a
          df -h "$RUNNER_TEMP"

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Verify actual native host and resolved target
        run: |
          set -euo pipefail
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          cargo metadata --locked --no-deps --format-version 1 | python3 -B -c \
            'import json,os,sys; assert json.load(sys.stdin)["target_directory"] == os.environ["CARGO_TARGET_DIR"]'

      - name: Install Go 1.25.5
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: false

      - name: Build csvtk 0.37.0
        run: |
          git init -q "$RUNNER_TEMP/csvtk"
          git -C "$RUNNER_TEMP/csvtk" remote add origin https://github.com/shenwei356/csvtk.git
          git -C "$RUNNER_TEMP/csvtk" fetch -q --depth=1 origin "refs/tags/$CSVTK_TAG"
          git -C "$RUNNER_TEMP/csvtk" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/csvtk" rev-parse HEAD)" = "$CSVTK_REVISION"
          mkdir -p "$RUNNER_TEMP/oracles"
          cd "$RUNNER_TEMP/csvtk"
          go build -trimpath -o "$RUNNER_TEMP/oracles/csvtk" ./csvtk
          "$RUNNER_TEMP/oracles/csvtk" version | grep -F 'csvtk v0.37.0'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Benchmark comparator tests
        if: matrix.target == 'linux-x86_64'
        run: |
          rustc --edition 2024 --test benchmarks/compare-groupby.rs -o "$RUNNER_TEMP/compare-groupby-tests"
          "$RUNNER_TEMP/compare-groupby-tests"

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test debug
        run: cargo test --locked --all-targets --all-features

      - name: Test release
        run: cargo test --release --locked --all-targets --all-features

      - name: Pinned csvtk differential
        env:
          RSOMICS_CSVTK: ${{ runner.temp }}/oracles/csvtk
        run: >-
          cargo test --locked --all-features
          --test select_compat --test filter_compat --test sort_compat --test join_compat
          -- --ignored

      - name: Verify complete source package
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/delivery/package-metadata.json"
          cargo package --locked --list > "$RUNNER_TEMP/delivery/package-files.txt"
          cargo package --locked > "$RUNNER_TEMP/delivery/package.stdout" 2> "$RUNNER_TEMP/delivery/package.stderr"
          python3 -B scripts/delivery.py source

      - name: Test packaged release
        run: cargo test --manifest-path "$PACKAGE_DIRECTORY/Cargo.toml" --release --locked --all-targets --all-features

      - name: Install and exercise packaged binary
        run: |
          set -euo pipefail
          cargo install --path "$PACKAGE_DIRECTORY" --locked --root "$RUNNER_TEMP/installed" \
            > "$RUNNER_TEMP/delivery/install.stdout" 2> "$RUNNER_TEMP/delivery/install.stderr"
          python3 -B "$PACKAGE_DIRECTORY/scripts/delivery.py" smoke --binary "$RUNNER_TEMP/installed/bin/rsomics-table"

      - name: Assemble native delivery candidate
        run: python3 -B scripts/delivery.py bundle --binary "$RUNNER_TEMP/installed/bin/rsomics-table"

      - name: Retain source and native delivery candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsomics-table-delivery-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 90

  benchmark-artifact:
    name: linux-x86_64-benchmark-artifact
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo-home
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      RUSTUP_HOME: ${{ runner.temp }}/rustup-home
      TMPDIR: ${{ runner.temp }}/scratch
      XDG_CACHE_HOME: ${{ runner.temp }}/cache

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare runner storage
        run: mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Build artifacts
        run: |
          cargo build --release --locked
          mkdir benchmark-artifact
          cp "$CARGO_TARGET_DIR/release/rsomics-table" benchmark-artifact/
          rustc --edition 2024 -O benchmarks/compare-groupby.rs -o benchmark-artifact/compare-groupby
          {
            rustc -Vv
            cargo -V
            ldd --version | head -n 1
            sha256sum benchmark-artifact/rsomics-table benchmark-artifact/compare-groupby
          } > benchmark-artifact/build-manifest.txt
          ldd benchmark-artifact/rsomics-table
          ldd benchmark-artifact/compare-groupby

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rsomics-table-linux-x86_64-${{ github.sha }}
          path: benchmark-artifact
          if-no-files-found: error
          retention-days: 90

  oracle:
    name: linux-x86_64-oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEDTOOLS_REVISION: 705ccfdf2c9a77d71560c8adcece0663c2f5e18e
      BEDTOOLS_TAG: v2.31.1
      DATAMASH_SHA256: f382ebda03650dd679161f758f9c0a6cc9293213438d4a77a8eda325aacb87d2
      CARGO_HOME: ${{ runner.temp }}/cargo-home
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      RUSTUP_HOME: ${{ runner.temp }}/rustup-home
      TMPDIR: ${{ runner.temp }}/scratch
      XDG_CACHE_HOME: ${{ runner.temp }}/cache
      GOPATH: ${{ runner.temp }}/go
      GOCACHE: ${{ runner.temp }}/cache/go-build
      GOMODCACHE: ${{ runner.temp }}/cache/go-mod

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare runner storage
        run: mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR" "$XDG_CACHE_HOME" "$GOPATH" "$GOCACHE" "$GOMODCACHE"

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Install Go 1.25.5
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: false

      - name: Build csvtk 0.37.0
        run: |
          git init -q "$RUNNER_TEMP/csvtk"
          git -C "$RUNNER_TEMP/csvtk" remote add origin https://github.com/shenwei356/csvtk.git
          git -C "$RUNNER_TEMP/csvtk" fetch -q --depth=1 origin "refs/tags/$CSVTK_TAG"
          git -C "$RUNNER_TEMP/csvtk" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/csvtk" rev-parse HEAD)" = "$CSVTK_REVISION"
          mkdir -p "$RUNNER_TEMP/oracles"
          cd "$RUNNER_TEMP/csvtk"
          go build -trimpath -o "$RUNNER_TEMP/oracles/csvtk" ./csvtk
          "$RUNNER_TEMP/oracles/csvtk" version | grep -F 'csvtk v0.37.0'

      - name: Build GNU datamash 1.9
        run: |
          curl -fsSLo "$RUNNER_TEMP/datamash-1.9.tar.gz" https://ftp.gnu.org/gnu/datamash/datamash-1.9.tar.gz
          echo "$DATAMASH_SHA256  $RUNNER_TEMP/datamash-1.9.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/datamash-1.9.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/datamash-1.9"
          ./configure --prefix="$RUNNER_TEMP/oracles/datamash"
          make -j2
          make install
          "$RUNNER_TEMP/oracles/datamash/bin/datamash" --version | grep -F 'datamash (GNU datamash) 1.9'

      - name: Install BEDTools build dependencies
        run: >-
          sudo env DEBIAN_FRONTEND=noninteractive
          apt-get -o Dpkg::Use-Pty=0 --no-install-recommends -y install
          libbz2-dev liblzma-dev zlib1g-dev

      - name: Build BEDTools 2.31.1
        run: |
          git init -q "$RUNNER_TEMP/bedtools2"
          git -C "$RUNNER_TEMP/bedtools2" remote add origin https://github.com/arq5x/bedtools2.git
          git -C "$RUNNER_TEMP/bedtools2" fetch -q --depth=1 origin "refs/tags/$BEDTOOLS_TAG:refs/tags/$BEDTOOLS_TAG"
          git -C "$RUNNER_TEMP/bedtools2" checkout -q --detach "$BEDTOOLS_TAG"
          test "$(git -C "$RUNNER_TEMP/bedtools2" rev-parse HEAD)" = "$BEDTOOLS_REVISION"
          make -C "$RUNNER_TEMP/bedtools2" -j2
          "$RUNNER_TEMP/bedtools2/bin/bedtools" --version | grep -F 'v2.31.1'

      - name: Pinned live differentials
        env:
          RSOMICS_CSVTK: ${{ runner.temp }}/oracles/csvtk
          RSOMICS_DATAMASH: ${{ runner.temp }}/oracles/datamash/bin/datamash
          RSOMICS_BEDTOOLS: ${{ runner.temp }}/bedtools2/bin/bedtools
        run: cargo test --locked --all-targets --all-features -- --include-ignored
